<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>RRF: 두 검색의 순위를 1/(순위+60)으로 바꿔 더한다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="408" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="84" height="24" rx="12" fill="#EEF2FF"/>
  <text x="70" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">06 · RRF</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">점수 대신 순위로 합친다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">05_02 실습: 질문 “외부 장소에서 회사 시스템 접속 시 VPN 보안 규칙”, 가중치 0.5 : 0.5</text>

  <!-- bm25 -->
  <rect x="28" y="116" width="210" height="112" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="42" y="128" width="96" height="22" rx="11" fill="#F1F5F9"/>
  <text x="90" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">BM25 순위</text>
  <g font-size="12.5">
    <circle cx="54" cy="174" r="10" fill="#334155"/><text x="54" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text><text x="72" y="178" fill="#0F172A">원격 근무 가이드</text>
    <rect x="42" y="192" width="182" height="26" rx="8" fill="#FEF3C7"/>
    <circle cx="54" cy="205" r="10" fill="#334155"/><text x="54" y="209" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text><text x="72" y="209" font-weight="700" fill="#78350F">보안 규정</text>
  </g>

  <!-- vector -->
  <rect x="28" y="240" width="210" height="112" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="42" y="252" width="104" height="22" rx="11" fill="#CCFBF1"/>
  <text x="94" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">벡터 검색 순위</text>
  <text x="226" y="267" text-anchor="end" font-size="10.5" fill="#94A3B8">노트 추정</text>
  <g font-size="12.5">
    <rect x="42" y="285" width="182" height="26" rx="8" fill="#FEF3C7"/>
    <circle cx="54" cy="298" r="10" fill="#0F766E"/><text x="54" y="302" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text><text x="72" y="302" font-weight="700" fill="#78350F">보안 규정</text>
    <circle cx="54" cy="330" r="10" fill="#0F766E"/><text x="54" y="334" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text><text x="72" y="334" fill="#0F172A">계정 관리 지침</text>
  </g>

  <path d="M240 172 H262 V234 H284" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M240 296 H262 V234 H290" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- result -->
  <rect x="294" y="116" width="438" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="310" y="128" width="130" height="22" rx="11" fill="#E0E7FF"/>
  <text x="375" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">RRF 합산 (c = 60)</text>
  <text x="716" y="143" text-anchor="end" font-size="12" fill="#4338CA" font-family="Consolas,'Courier New',monospace">Σ w / (rank + c)</text>

  <rect x="310" y="162" width="406" height="54" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <circle cx="330" cy="189" r="12" fill="#D97706"/><text x="330" y="193" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
  <text x="352" y="185" font-size="13.5" font-weight="800" fill="#78350F">보안 규정</text>
  <text x="352" y="204" font-size="11" fill="#92400E" font-family="Consolas,'Courier New',monospace">0.5/62 + 0.5/61</text>
  <rect x="520" y="180" width="120" height="12" rx="6" fill="#D97706"/>
  <text x="708" y="191" text-anchor="end" font-size="12.5" font-weight="800" fill="#78350F">0.01626</text>

  <circle cx="330" cy="243" r="12" fill="#334155"/><text x="330" y="247" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">2</text>
  <text x="352" y="239" font-size="13.5" font-weight="700" fill="#0F172A">원격 근무 가이드</text>
  <text x="352" y="258" font-size="11" fill="#64748B" font-family="Consolas,'Courier New',monospace">0.5/61</text>
  <rect x="520" y="234" width="60.5" height="12" rx="6" fill="#94A3B8"/>
  <text x="708" y="245" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">0.00820</text>

  <circle cx="330" cy="295" r="12" fill="#334155"/><text x="330" y="299" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
  <text x="352" y="291" font-size="13.5" font-weight="700" fill="#0F172A">계정 관리 지침</text>
  <text x="352" y="310" font-size="11" fill="#64748B" font-family="Consolas,'Courier New',monospace">0.5/62</text>
  <rect x="520" y="286" width="59.5" height="12" rx="6" fill="#94A3B8"/>
  <text x="708" y="297" text-anchor="end" font-size="12.5" font-weight="700" fill="#334155">0.00806</text>

  <text x="513" y="338" text-anchor="middle" font-size="11.5" fill="#64748B">순위는 1부터 센다 · 중복 문서는 하나로 합친다</text>

  <rect x="28" y="366" width="430" height="28" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="243" y="385" text-anchor="middle" font-size="12" fill="#92400E"><tspan font-weight="800">양쪽에 다 나온 문서가 유리</tspan> · 점수 단위가 달라도 순위만 쓴다</text>
  <text x="732" y="385" text-anchor="end" font-size="11" fill="#94A3B8">출처: langchain-classic 1.0.8 소스 · Cormack 2009</text>
</svg>
