<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>ids 없이 두 번 저장하면 중복, ids를 주면 덮어쓰기</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="378" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="76" height="24" rx="12" fill="#EEF2FF"/>
  <text x="66" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">04 · ids</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">ids가 있으면 덮어쓰고, 없으면 쌓인다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">같은 규정 문서 3개를 두 번 저장했을 때 DB 테이블 모습 (커널 재시작 후 다시 실행한 상황)</text>

  <!-- left -->
  <rect x="28" y="116" width="340" height="212" rx="14" fill="#FFFFFF" stroke="#FECDD3" filter="url(#sh)"/>
  <rect x="44" y="128" width="128" height="22" rx="11" fill="#FFF1F2"/>
  <text x="108" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#BE123C">ids 없이 두 번 실행</text>
  <rect x="270" y="128" width="84" height="22" rx="11" fill="#E11D48"/>
  <text x="312" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">6행 · 중복</text>
  <g font-size="11.5">
    <rect x="44" y="160" width="308" height="22" fill="#F1F5F9"/>
    <text x="54" y="175" font-weight="700" fill="#475569">id (uuid4)</text><text x="160" y="175" font-weight="700" fill="#475569">document</text>
    <g fill="#334155" font-family="Consolas,'Courier New',monospace"><text x="54" y="197">a1f3…</text><text x="54" y="219">7c20…</text><text x="54" y="241">e94b…</text></g>
    <g fill="#334155"><text x="160" y="197">대출 자격</text><text x="160" y="219">대출 권수·기간</text><text x="160" y="241">연체·제재</text></g>
    <rect x="44" y="250" width="308" height="66" rx="6" fill="#FFF1F2"/>
    <g fill="#9F1239" font-family="Consolas,'Courier New',monospace"><text x="54" y="267">3d8e…</text><text x="54" y="289">b512…</text><text x="54" y="311">0fa7…</text></g>
    <g fill="#9F1239"><text x="160" y="267">대출 자격</text><text x="160" y="289">대출 권수·기간</text><text x="160" y="311">연체·제재</text></g>
    <text x="342" y="267" text-anchor="end" font-size="11" font-weight="700" fill="#E11D48">← 새 uuid로 또 들어감</text>
  </g>

  <!-- right -->
  <rect x="392" y="116" width="340" height="212" rx="14" fill="#FFFFFF" stroke="#A7F3D0" filter="url(#sh)"/>
  <rect x="408" y="128" width="128" height="22" rx="11" fill="#ECFDF5"/>
  <text x="472" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">ids=[…] 지정</text>
  <rect x="634" y="128" width="84" height="22" rx="11" fill="#16A34A"/>
  <text x="676" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3행 그대로</text>
  <g font-size="11.5">
    <rect x="408" y="160" width="308" height="22" fill="#F1F5F9"/>
    <text x="418" y="175" font-weight="700" fill="#475569">id (지정)</text><text x="536" y="175" font-weight="700" fill="#475569">document</text>
    <g fill="#334155" font-family="Consolas,'Courier New',monospace"><text x="418" y="197">rule_001</text><text x="418" y="219">rule_002</text><text x="418" y="241">rule_003</text></g>
    <g fill="#334155"><text x="536" y="197">대출 자격</text><text x="536" y="219">대출 권수·기간</text><text x="536" y="241">연체·제재</text></g>
    <rect x="408" y="256" width="308" height="56" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="562" y="279" text-anchor="middle" font-weight="700" fill="#065F46">두 번째 실행: 같은 id → 갱신(upsert)</text>
    <text x="562" y="299" text-anchor="middle" fill="#047857" font-family="Consolas,'Courier New',monospace">on_conflict_do_update</text>
  </g>

  <rect x="28" y="340" width="420" height="28" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="238" y="359" text-anchor="middle" font-size="12" fill="#92400E">커널을 재시작해도 <tspan font-weight="800">DB 데이터는 남아 있다</tspan> → 다시 넣을 땐 ids</text>
  <text x="732" y="359" text-anchor="end" font-size="11" fill="#94A3B8">출처: langchain-postgres 0.0.19 소스</text>
</svg>
