<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>코사인 유사도, 코사인 거리, 관련도 점수의 눈금 비교</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDA4AF"/><stop offset="0.5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#F1F5F9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD5E1" stroke-width="2.5"/></pattern>
  </defs>
  <rect x="1" y="1" width="758" height="418" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="108" height="24" rx="12" fill="#EEF2FF"/>
  <text x="82" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">02 · 점수 읽기</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">같은 비교, 세 가지 눈금</text>
  <text x="28" y="98" font-size="13" fill="#64748B">어느 함수가 어떤 점수를 돌려주는지 헷갈릴 때 보는 표</text>

  <text x="262" y="128" font-size="12.5" font-weight="700" fill="#E11D48">← 다르다</text>
  <text x="700" y="128" text-anchor="end" font-size="12.5" font-weight="700" fill="#0F766E">비슷하다 →</text>

  <!-- row 1 -->
  <rect x="28" y="138" width="704" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="48" y="166" font-size="15" font-weight="800" fill="#0F172A">코사인 유사도</text>
  <rect x="48" y="176" width="112" height="20" rx="10" fill="#F1F5F9"/><text x="104" y="190" text-anchor="middle" font-size="11" fill="#475569">numpy 직접 계산</text>
  <rect x="262" y="160" width="438" height="12" rx="6" fill="url(#gr)"/>
  <g font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">
    <circle cx="262" cy="166" r="4" fill="#E11D48"/><text x="262" y="194">-1</text>
    <circle cx="481" cy="166" r="4" fill="#94A3B8"/><text x="481" y="194">0</text>
    <circle cx="700" cy="166" r="4" fill="#0F766E"/><text x="700" y="194">1</text>
  </g>

  <!-- row 2 -->
  <rect x="28" y="220" width="704" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <text x="48" y="248" font-size="15" font-weight="800" fill="#0F172A">코사인 거리</text>
  <rect x="48" y="258" width="190" height="20" rx="10" fill="#F1F5F9"/><text x="143" y="272" text-anchor="middle" font-size="11" fill="#475569">pgvector &lt;=&gt; · ..._with_score</text>
  <rect x="262" y="242" width="438" height="12" rx="6" fill="url(#gr)"/>
  <g font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">
    <circle cx="262" cy="248" r="4" fill="#E11D48"/><text x="262" y="276">2</text>
    <circle cx="481" cy="248" r="4" fill="#94A3B8"/><text x="481" y="276">1</text>
    <circle cx="700" cy="248" r="4" fill="#0F766E"/><text x="700" y="276">0</text>
  </g>
  <text x="590" y="276" text-anchor="middle" font-size="11" fill="#64748B">= 1 − 유사도 (작을수록 비슷)</text>

  <!-- row 3 -->
  <rect x="28" y="302" width="704" height="70" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <text x="48" y="330" font-size="15" font-weight="800" fill="#0F172A">관련도 점수</text>
  <rect x="48" y="340" width="190" height="20" rx="10" fill="#EEF2FF"/><text x="143" y="354" text-anchor="middle" font-size="11" fill="#4338CA">..._relevance_scores · threshold</text>
  <rect x="262" y="324" width="219" height="12" rx="6" fill="url(#hatch)"/>
  <rect x="481" y="324" width="219" height="12" rx="6" fill="#2DD4BF"/>
  <g font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="262" y="358">-1</text>
    <circle cx="481" cy="330" r="4" fill="#0F172A"/><text x="481" y="358">0</text>
    <text x="700" y="358">1</text>
  </g>
  <text x="372" y="316" text-anchor="middle" font-size="11" fill="#64748B">이론상 가능 · 나오면 경고만</text>
  <text x="590" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E">LangChain이 기대하는 0~1</text>

  <!-- equation -->
  <rect x="28" y="382" width="420" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="732" y="400" text-anchor="end" font-size="11" fill="#94A3B8">출처: pgvector README · langchain-core 1.8.1 소스</text>
  <text x="238" y="400" text-anchor="middle" font-size="12.5" fill="#3730A3">관련도 = 1 − 거리 = 1 − (1 − 유사도) = <tspan font-weight="800">코사인 유사도</tspan></text>
</svg>
