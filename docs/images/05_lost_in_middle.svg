<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>Lost in the Middle: 정답 문서 위치에 따른 정확도 U자 곡선 개념도</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <linearGradient id="fillu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818CF8" stop-opacity="0.28"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="358" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="168" height="24" rx="12" fill="#EEF2FF"/>
  <text x="112" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">05 · Lost in the Middle</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">중요한 문서는 앞이나 뒤에</text>
  <text x="28" y="98" font-size="13" fill="#64748B">정답 문서가 컨텍스트의 어디에 있느냐에 따라 정확도가 달라진다 · 모양만 나타낸 개념 그림(실제 수치 아님)</text>

  <rect x="28" y="116" width="704" height="186" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <!-- axes -->
  <line x1="96" y1="136" x2="96" y2="250" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="96" y1="250" x2="700" y2="250" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="88" y="146" text-anchor="end" font-size="11" fill="#64748B">높음</text>
  <text x="88" y="246" text-anchor="end" font-size="11" fill="#64748B">낮음</text>
  <text x="56" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">정확도</text>

  <!-- curve -->
  <path d="M120 152 C 250 236, 550 236, 680 166 L680 250 L120 250 Z" fill="url(#fillu)"/>
  <path d="M120 152 C 250 236, 550 236, 680 166" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="152" r="6" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="400" cy="218" r="6" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="680" cy="166" r="6" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="134" y="138" width="78" height="22" rx="11" fill="#DCFCE7"/><text x="173" y="153" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">잘 찾음</text>
  <rect x="588" y="140" width="78" height="22" rx="11" fill="#DCFCE7"/><text x="627" y="155" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">잘 찾음</text>
  <rect x="352" y="182" width="96" height="22" rx="11" fill="#FFE4E6"/><text x="400" y="197" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">놓치기 쉬움</text>

  <!-- document stack along axis -->
  <g fill="#F1F5F9" stroke="#CBD5E1">
    <rect x="112" y="258" width="16" height="20" rx="3" fill="#DCFCE7" stroke="#86EFAC"/><rect x="172" y="258" width="16" height="20" rx="3"/><rect x="232" y="258" width="16" height="20" rx="3"/><rect x="292" y="258" width="16" height="20" rx="3"/><rect x="352" y="258" width="16" height="20" rx="3"/><rect x="392" y="258" width="16" height="20" rx="3" fill="#FFE4E6" stroke="#FDA4AF"/><rect x="432" y="258" width="16" height="20" rx="3"/><rect x="492" y="258" width="16" height="20" rx="3"/><rect x="552" y="258" width="16" height="20" rx="3"/><rect x="612" y="258" width="16" height="20" rx="3"/><rect x="672" y="258" width="16" height="20" rx="3" fill="#DCFCE7" stroke="#86EFAC"/>
  </g>
  <g font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle"><text x="120" y="294">처음</text><text x="400" y="294">중간</text><text x="680" y="294">끝</text></g>

  <rect x="28" y="314" width="440" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="248" y="334" text-anchor="middle" font-size="12" fill="#3730A3">대응: <tspan font-weight="800">top-k는 적당히, 관련 높은 문서는 앞에</tspan> (→ 07 리랭킹)</text>
  <text x="732" y="334" text-anchor="end" font-size="11" fill="#94A3B8">출처: Liu et al. 2023 (TACL 2024)</text>
</svg>
