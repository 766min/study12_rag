<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>BM25 점수의 세 요소: TF 포화, IDF, 문서 길이 보정</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="92" height="24" rx="12" fill="#EEF2FF"/>
  <text x="74" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">06 · BM25</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">BM25 점수를 만드는 세 가지 손잡이</text>
  <text x="28" y="98" font-size="13" fill="#64748B">TF-IDF를 바탕으로, 많이 나와도 끝없이 오르지 않게 하고 긴 문서는 깎는다</text>

  <!-- card 1 -->
  <rect x="28" y="116" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
