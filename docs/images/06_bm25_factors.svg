  <text x="140" y="278" text-anchor="middle" font-size="10.5" fill="#64748B">단어가 나온 횟수 →</text>
  <rect x="150" y="226" width="12" height="3" fill="#0F766E"/><text x="166" y="231" font-size="10.5" fill="#0F766E">BM25</text>
  <rect x="150" y="240" width="12" height="3" fill="#94A3B8"/><text x="166" y="245" font-size="10.5" fill="#64748B">TF-IDF</text>
  <text x="138" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">10번 나와도 10배가 아니다</text>
  <text x="138" y="316" text-anchor="middle" font-size="11.5" fill="#64748B">점점 덜 오르다가 멈춘다</text>

  <!-- card 2 -->
  <rect x="270" y="116" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="284" y="128" width="70" height="22" rx="11" fill="#E0E7FF"/>
  <text x="319" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">② IDF</text>
