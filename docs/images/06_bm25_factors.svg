  <rect x="28" y="340" width="380" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="218" y="359" text-anchor="middle" font-size="12" fill="#0F766E">rank_bm25 <tspan font-family="Consolas,'Courier New',monospace">BM25Okapi</tspan> 기본값: <tspan font-weight="800">k1=1.5 · b=0.75</tspan></text>
