  <line x1="56" y1="182" x2="226" y2="182" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="226" y="176" text-anchor="end" font-size="10.5" font-weight="700" fill="#B45309">상한 (k1)</text>
