<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>LoRA: 학습할 때와 서비스할 때</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#14B8A6"/></marker>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="408" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="80" height="24" rx="12" fill="#EEF2FF"/>
  <text x="68" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">01 · LoRA</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">큰 가중치는 얼리고, 작은 행렬만 학습한다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">학습할 때는 옆에 붙여서 배우고, 서비스할 때는 하나로 합친다</text>

  <!-- left card -->
  <rect x="28" y="116" width="404" height="226" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="44" y="128" width="78" height="22" rx="11" fill="#F1F5F9"/>
  <text x="83" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">학습할 때</text>

  <circle cx="62" cy="236" r="15" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="62" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">x</text>
  <path d="M77 236 H92 V192 H112" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M92 236 V284 H112" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="116" y="160" width="180" height="64" rx="12" fill="#E2E8F0"/>
  <text x="196" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#334155">W</text>
  <text x="196" y="210" text-anchor="middle" font-size="12" fill="#475569">사전학습 가중치 · 고정</text>
  <rect x="270" y="172" width="13" height="10" rx="2" fill="#64748B"/>
  <path d="M272.5 172 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#64748B" stroke-width="1.8"/>

  <rect x="116" y="262" width="66" height="44" rx="10" fill="#CCFBF1" stroke="#14B8A6"/>
  <text x="149" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#0F766E">A</text>
  <line x1="184" y1="284" x2="224" y2="284" stroke="#14B8A6" stroke-width="2" marker-end="url(#art)"/>
  <rect x="230" y="262" width="66" height="44" rx="10" fill="#CCFBF1" stroke="#14B8A6"/>
  <text x="263" y="290" text-anchor="middle" font-size="17" font-weight="800" fill="#0F766E">B</text>
  <text x="206" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">학습하는 건 이 작은 행렬뿐</text>

  <circle cx="344" cy="236" r="15" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="344" y="242" text-anchor="middle" font-size="18" fill="#334155">+</text>
  <path d="M296 192 H344 V217" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M296 284 H344 V255" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#art)"/>
  <line x1="359" y1="236" x2="386" y2="236" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="404" cy="236" r="15" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="404" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">h</text>

  <!-- right card -->
  <rect x="452" y="116" width="280" height="226" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="468" y="128" width="120" height="22" rx="11" fill="#EEF2FF"/>
  <text x="528" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">서비스할 때 · merge</text>

  <circle cx="482" cy="226" r="15" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="482" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">x</text>
  <line x1="497" y1="226" x2="520" y2="226" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="524" y="176" width="140" height="100" rx="14" fill="url(#ind)"/>
  <text x="594" y="220" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">W + B·A</text>
  <text x="594" y="243" text-anchor="middle" font-size="12" fill="#E0E7FF">하나로 합친 가중치</text>
  <line x1="664" y1="226" x2="686" y2="226" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="704" cy="226" r="15" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="704" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">h</text>
  <rect x="514" y="294" width="160" height="28" rx="14" fill="#DCFCE7"/>
  <text x="594" y="313" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">추론 지연 추가 없음</text>

  <!-- footer chips -->
  <rect x="28" y="356" width="246" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="151" y="375" text-anchor="middle" font-size="12" fill="#0F766E"><tspan font-weight="700">학습 파라미터 약 1/10,000</tspan> (GPT-3 기준)</text>
  <text x="732" y="375" text-anchor="end" font-size="11" fill="#94A3B8">출처: Hu et al. 2021, LoRA (arXiv:2106.09685)</text>
</svg>
