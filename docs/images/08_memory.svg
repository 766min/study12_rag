<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>LLM 대화 기억: 매 요청마다 지난 대화를 다시 보내고, 길어지면 요약하거나 검색해서 넣는다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="418" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="108" height="24" rx="12" fill="#EEF2FF"/>
  <text x="82" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">08 · 대화 기억</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">LLM은 기억하지 않는다, 앱이 다시 보내 준다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">각 요청은 독립적이고 상태가 없다(stateless) · 기억처럼 보이는 건 프롬프트 덕분</text>

  <!-- top card -->
  <rect x="28" y="116" width="704" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="48" y="152" text-anchor="start" fill="#64748B">요청 1</text>
    <rect x="104" y="138" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="132" y="153" fill="#3730A3">질문1</text>

    <text x="48" y="186" text-anchor="start" fill="#64748B">요청 2</text>
    <rect x="104" y="172" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="132" y="187" fill="#3730A3">질문1</text>
    <rect x="166" y="172" width="56" height="22" rx="11" fill="#F1F5F9"/><text x="194" y="187" fill="#475569">답1</text>
    <rect x="228" y="172" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="256" y="187" fill="#3730A3">질문2</text>

    <text x="48" y="220" text-anchor="start" fill="#64748B">요청 3</text>
    <rect x="104" y="206" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="132" y="221" fill="#3730A3">질문1</text>
    <rect x="166" y="206" width="56" height="22" rx="11" fill="#F1F5F9"/><text x="194" y="221" fill="#475569">답1</text>
    <rect x="228" y="206" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="256" y="221" fill="#3730A3">질문2</text>
    <rect x="290" y="206" width="56" height="22" rx="11" fill="#F1F5F9"/><text x="318" y="221" fill="#475569">답2</text>
    <rect x="352" y="206" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="380" y="221" fill="#3730A3">질문3</text>
  </g>
  <path d="M430 217 H470" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="478" y="140" width="238" height="88" rx="12" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="494" y="166" font-size="13" font-weight="800" fill="#9F1239">계속 길어지면?</text>
  <text x="494" y="188" font-size="12" fill="#9F1239">· 컨텍스트 윈도우 한계</text>
  <text x="494" y="208" font-size="12" fill="#9F1239">· 토큰 비용 증가, Lost in the Middle</text>

  <!-- bottom left -->
  <rect x="28" y="262" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="44" y="274" width="120" height="22" rx="11" fill="#E0E7FF"/>
  <text x="104" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">① 요약해서 넣기</text>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="44" y="306" width="128" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/><text x="108" y="321" fill="#3730A3">지난 대화 요약본</text>
    <rect x="178" y="306" width="56" height="22" rx="11" fill="#F1F5F9"/><text x="206" y="321" fill="#475569">답2</text>
    <rect x="240" y="306" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="268" y="321" fill="#3730A3">질문3</text>
  </g>
  <text x="44" y="352" font-size="11.5" fill="#64748B">토큰 ↓ · 세부 내용은 잃을 수 있음</text>

  <!-- bottom right -->
  <rect x="392" y="262" width="340" height="104" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="408" y="274" width="168" height="22" rx="11" fill="#CCFBF1"/>
  <text x="492" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">② 관련 대화만 검색해 넣기</text>
  <circle cx="424" cy="317" r="12" fill="#CCFBF1"/>
  <ellipse cx="424" cy="312" rx="6" ry="2.4" fill="none" stroke="#0F766E" stroke-width="1.5"/>
  <path d="M418 312v9a6 2.4 0 0 0 12 0v-9" fill="none" stroke="#0F766E" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="446" y="306" width="96" height="22" rx="11" fill="#F0FDFA" stroke="#99F6E4"/><text x="494" y="321" fill="#0F766E">관련 과거 대화</text>
    <rect x="548" y="306" width="56" height="22" rx="11" fill="#E0E7FF"/><text x="576" y="321" fill="#3730A3">질문3</text>
  </g>
  <text x="408" y="352" font-size="11.5" fill="#64748B">필요한 것만 · 대화에 RAG를 적용한 셈</text>

  <text x="732" y="396" text-anchor="end" font-size="11" fill="#94A3B8">출처: OpenAI Docs: Conversation state · langchain-classic memory</text>
</svg>
