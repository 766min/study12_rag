<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>RAG 기본 흐름: 질문이 검색·증강·생성을 거쳐 답변이 된다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#14B8A6"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="428" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- header -->
  <rect x="28" y="22" width="122" height="24" rx="12" fill="#EEF2FF"/>
  <text x="89" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">01 · RAG 기본 흐름</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">질문이 답변이 되기까지</text>
  <text x="28" y="98" font-size="13" fill="#64748B">모델은 그대로 두고, 검색한 문서를 프롬프트에 넣어 답한다</text>

  <!-- row 1: question -->
  <rect x="28" y="120" width="190" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <circle cx="62" cy="162" r="18" fill="#F1F5F9"/>
  <path d="M52 154h20a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-12l-5 4v-4h-3a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="90" y="157" font-size="15" font-weight="700" fill="#0F172A">사용자 질문</text>
  <text x="90" y="178" font-size="13" fill="#64748B">“대출 기간은?”</text>

  <!-- row 1: retrieval -->
  <rect x="278" y="120" width="210" height="84" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <circle cx="312" cy="162" r="18" fill="#CCFBF1"/>
  <circle cx="309" cy="159" r="6.5" fill="none" stroke="#0F766E" stroke-width="2.2"/>
  <line x1="314" y1="164" x2="320" y2="170" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round"/>
  <text x="340" y="157" font-size="15" font-weight="700" fill="#0F172A">① 검색 <tspan font-weight="400" fill="#0F766E" font-size="12">Retrieval</tspan></text>
  <text x="340" y="178" font-size="12.5" fill="#64748B">질문을 벡터로 바꿔 검색</text>

  <!-- row 1: vector db -->
  <rect x="548" y="120" width="184" height="84" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <circle cx="582" cy="162" r="18" fill="#CCFBF1"/>
  <ellipse cx="582" cy="154" rx="9" ry="3.5" fill="none" stroke="#0F766E" stroke-width="1.8"/>
  <path d="M573 154v15a9 3.5 0 0 0 18 0v-15M573 161.5a9 3.5 0 0 0 18 0" fill="none" stroke="#0F766E" stroke-width="1.8"/>
  <text x="610" y="157" font-size="15" font-weight="700" fill="#0F172A">벡터 DB</text>
  <text x="610" y="178" font-size="12.5" fill="#64748B">청크 + 임베딩 저장</text>

  <line x1="220" y1="162" x2="272" y2="162" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="162" x2="542" y2="162" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- down connectors -->
  <line x1="123" y1="206" x2="123" y2="266" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="133" y="225" width="82" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="174" y="240" text-anchor="middle" font-size="11.5" fill="#475569">질문 그대로</text>
  <path d="M640 206 V238 H230 V266" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#art)"/>
  <rect x="372" y="227" width="128" height="22" rx="11" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="436" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F766E">관련 문서 top-k</text>

  <!-- row 2: augment -->
  <rect x="28" y="272" width="270" height="104" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <text x="48" y="298" font-size="15" font-weight="700" fill="#0F172A">② 증강 <tspan font-weight="400" fill="#4F46E5" font-size="12">Augmented</tspan></text>
  <rect x="48" y="310" width="230" height="24" rx="7" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="58" y="327" font-size="12" fill="#0F766E"><tspan font-weight="700">[참고 문서]</tspan> 검색된 청크들</text>
  <rect x="48" y="340" width="230" height="24" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="58" y="357" font-size="12" fill="#334155"><tspan font-weight="700">[질문]</tspan> 대출 기간은?</text>

  <!-- row 2: generation -->
  <rect x="358" y="272" width="190" height="104" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <circle cx="392" cy="324" r="18" fill="#E0E7FF"/>
  <path d="M392 312 L395 321 L404 324 L395 327 L392 336 L389 327 L380 324 L389 321 Z" fill="#4F46E5"/>
  <text x="420" y="318" font-size="15" font-weight="700" fill="#0F172A">③ 생성</text>
  <text x="420" y="338" font-size="12" fill="#4F46E5">Generation</text>
  <text x="420" y="356" font-size="12" fill="#64748B">LLM은 그대로</text>

  <!-- row 2: answer -->
  <rect x="608" y="272" width="124" height="104" rx="14" fill="#FFFFFF" stroke="#BBF7D0" filter="url(#sh)"/>
  <circle cx="670" cy="306" r="17" fill="#DCFCE7"/>
  <path d="M662 306 l5 5 l10 -10" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">답변</text>
  <text x="670" y="363" text-anchor="middle" font-size="12" fill="#64748B">근거 문서 포함</text>

  <line x1="300" y1="324" x2="352" y2="324" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="550" y1="324" x2="602" y2="324" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- footer -->
  <circle cx="34" cy="404" r="5" fill="#14B8A6"/><text x="44" y="408" font-size="11.5" fill="#475569">검색 단계</text>
  <circle cx="114" cy="404" r="5" fill="#6366F1"/><text x="124" y="408" font-size="11.5" fill="#475569">생성 단계</text>
  <text x="732" y="408" text-anchor="end" font-size="11" fill="#94A3B8">출처: Lewis et al. 2020 · LangChain Docs: Retrieval</text>
</svg>
