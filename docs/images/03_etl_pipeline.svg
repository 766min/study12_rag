<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>ETL 파이프라인: 문서를 읽고, 자르고, 임베딩해서 벡터 DB에 넣는다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="348" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="76" height="24" rx="12" fill="#EEF2FF"/>
  <text x="66" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">03 · ETL</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">문서를 읽고, 잘라서, 숫자로 바꿔 넣는다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">Extract → Transform(청킹 + 임베딩) → Load</text>

  <!-- E -->
  <rect x="28" y="116" width="200" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="44" y="128" width="110" height="22" rx="11" fill="#F1F5F9"/>
  <text x="99" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Extract · 추출</text>
  <path d="M52 166h22l8 8v30h-30z" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M74 166v8h8" fill="none" stroke="#E11D48" stroke-width="1.6"/>
  <text x="67" y="194" text-anchor="middle" font-size="9" font-weight="800" fill="#E11D48">PDF</text>
  <text x="94" y="182" font-size="13" font-weight="700" fill="#0F172A">PDF 문서</text>
  <text x="94" y="200" font-size="11.5" fill="#64748B">PyMuPDFLoader</text>
  <circle cx="67" cy="238" r="15" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <ellipse cx="67" cy="238" rx="6.5" ry="15" fill="none" stroke="#4F46E5" stroke-width="1.4"/>
  <line x1="52" y1="238" x2="82" y2="238" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="94" y="236" font-size="13" font-weight="700" fill="#0F172A">웹 페이지</text>
  <text x="94" y="254" font-size="11.5" fill="#64748B">WebBaseLoader</text>
  <text x="128" y="280" text-anchor="middle" font-size="11.5" fill="#475569">→ Document (PDF: 페이지당 1개)</text>

  <line x1="230" y1="204" x2="264" y2="204" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- T -->
  <rect x="268" y="116" width="268" height="176" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="284" y="128" width="126" height="22" rx="11" fill="#CCFBF1"/>
  <text x="347" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">Transform · 변환</text>
  <g font-size="12" font-weight="700" fill="#134E4A">
    <rect x="286" y="164" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="334" y="183" text-anchor="middle">청크 1</text>
    <rect x="286" y="200" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="334" y="219" text-anchor="middle">청크 2</text>
    <rect x="286" y="236" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="334" y="255" text-anchor="middle">청크 3</text>
  </g>
  <g stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)">
    <line x1="384" y1="178" x2="404" y2="178"/><line x1="384" y1="214" x2="404" y2="214"/><line x1="384" y1="250" x2="404" y2="250"/>
  </g>
  <g font-size="11" fill="#3730A3" font-family="Consolas,'Courier New',monospace">
    <rect x="408" y="166" width="112" height="24" rx="12" fill="#EEF2FF"/><text x="464" y="182" text-anchor="middle">[0.02, -0.1, …]</text>
    <rect x="408" y="202" width="112" height="24" rx="12" fill="#EEF2FF"/><text x="464" y="218" text-anchor="middle">[0.31, 0.05, …]</text>
    <rect x="408" y="238" width="112" height="24" rx="12" fill="#EEF2FF"/><text x="464" y="254" text-anchor="middle">[-0.2, 0.17, …]</text>
  </g>
  <text x="334" y="282" text-anchor="middle" font-size="11.5" fill="#0F766E">① 청킹 (splitter)</text>
  <text x="464" y="282" text-anchor="middle" font-size="11.5" fill="#4F46E5">② 임베딩</text>

  <line x1="538" y1="204" x2="566" y2="204" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- L -->
  <rect x="570" y="116" width="162" height="176" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="586" y="128" width="88" height="22" rx="11" fill="#CCFBF1"/>
  <text x="630" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">Load · 적재</text>
  <circle cx="651" cy="200" r="26" fill="#CCFBF1"/>
  <ellipse cx="651" cy="188" rx="13" ry="5" fill="none" stroke="#0F766E" stroke-width="2"/>
  <path d="M638 188v22a13 5 0 0 0 26 0v-22M638 199a13 5 0 0 0 26 0" fill="none" stroke="#0F766E" stroke-width="2"/>
  <text x="651" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">벡터 DB</text>
  <text x="651" y="268" text-anchor="middle" font-size="11.5" fill="#64748B">청크 + 벡터 + 메타데이터</text>

  <rect x="28" y="306" width="420" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="238" y="325" text-anchor="middle" font-size="12" fill="#0F766E">청크마다 <tspan font-weight="800">메타데이터(출처·연도)가 복사</tspan>되어 함께 저장된다</text>
  <text x="732" y="325" text-anchor="end" font-size="11" fill="#94A3B8">출처: LangChain Docs · text-splitters 1.1.3 소스</text>
</svg>
