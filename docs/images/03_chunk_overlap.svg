<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>chunk_overlap: 경계 부분을 두 청크가 함께 가져간다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="328" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="96" height="24" rx="12" fill="#EEF2FF"/>
  <text x="76" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">03 · overlap</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">겹쳐 자르면 경계의 문장이 살아남는다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">경계에 걸친 문장을 앞 청크와 뒤 청크가 둘 다 가져간다</text>

  <rect x="28" y="116" width="704" height="156" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>

  <!-- overlap column -->
  <rect x="318" y="124" width="144" height="140" rx="10" fill="#FEF3C7"/>
  <rect x="350" y="130" width="80" height="20" rx="10" fill="#D97706"/>
  <text x="390" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">겹침 영역</text>

  <!-- original -->
  <text x="48" y="178" font-size="12" font-weight="700" fill="#64748B">원문</text>
  <rect x="92" y="160" width="620" height="28" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="104" y="179" font-size="12" fill="#334155">제1조 학기당 12~19학점 …</text>
  <text x="390" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">제2조 평점 4.0 이상은</text>
  <text x="472" y="179" font-size="12" fill="#334155">최대 21학점 … 제3조 장학금 …</text>

  <!-- chunk 1 -->
  <text x="48" y="215" font-size="12" font-weight="700" fill="#0F766E">청크 1</text>
  <rect x="92" y="198" width="370" height="26" rx="8" fill="#CCFBF1" stroke="#14B8A6"/>
  <text x="104" y="216" font-size="12" fill="#134E4A">제1조 학기당 12~19학점 …</text>
  <text x="390" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#134E4A">제2조 평점 4.0 이상은</text>
  <!-- chunk 2 -->
  <text x="48" y="249" font-size="12" font-weight="700" fill="#4F46E5">청크 2</text>
  <rect x="318" y="232" width="394" height="26" rx="8" fill="#E0E7FF" stroke="#818CF8"/>
  <text x="390" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#312E81">제2조 평점 4.0 이상은</text>
  <text x="472" y="250" font-size="12" fill="#312E81">최대 21학점 … 제3조 장학금 …</text>

  <rect x="28" y="286" width="420" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="238" y="305" text-anchor="middle" font-size="12" fill="#0F766E">LangChain 기본값: <tspan font-weight="800">chunk_size 4000 · overlap 200</tspan> (글자 수)</text>
  <text x="732" y="305" text-anchor="end" font-size="11" fill="#94A3B8">출처: text-splitters 1.1.3 소스 (base.py)</text>
</svg>
