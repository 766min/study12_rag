<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>코사인 유사도와 유클리드 거리의 차이, 정규화하면 순위가 같아짐</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#F1F5F9" stroke-width="1"/></pattern>
    <marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F766E"/></marker>
    <marker id="mt2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#5EEAD4"/></marker>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4F46E5"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="94" height="24" rx="12" fill="#EEF2FF"/>
  <text x="75" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">02 · 유사도</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">각도로 볼까, 거리로 볼까</text>
  <text x="28" y="98" font-size="13" fill="#64748B">벡터 길이가 제각각이면 두 방식의 답이 다르고, 길이를 1로 맞추면 같아진다</text>

  <!-- left card -->
  <rect x="28" y="116" width="340" height="270" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="29" y="117" width="338" height="268" rx="13" fill="url(#g)"/>
  <rect x="44" y="128" width="118" height="22" rx="11" fill="#F1F5F9"/>
  <text x="103" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">① 길이가 제각각</text>

  <path d="M70 350 L105.4 314.6 A50 50 0 0 1 119.8 345.2 Z" fill="#FEF3C7"/>
  <text x="122" y="333" font-size="14" font-weight="700" fill="#B45309">θ</text>
  <line x1="70" y1="350" x2="150" y2="270" stroke="#0F766E" stroke-width="3" marker-end="url(#mt)"/>
  <line x1="70" y1="350" x2="290" y2="130" stroke="#5EEAD4" stroke-width="3" marker-end="url(#mt2)"/>
  <line x1="70" y1="350" x2="320" y2="326" stroke="#4F46E5" stroke-width="3" marker-end="url(#mi)"/>
  <circle cx="70" cy="350" r="4" fill="#0F172A"/>
  <text x="128" y="262" font-size="15" font-weight="800" fill="#0F766E">A</text>
  <text x="298" y="138" font-size="15" font-weight="800" fill="#0D9488">B</text>
  <text x="328" y="331" font-size="15" font-weight="800" fill="#4F46E5">C</text>

  <line x1="150" y1="270" x2="290" y2="130" stroke="#F43F5E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="222" y="192" width="98" height="22" rx="11" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="271" y="207" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">A–B 거리 198</text>
  <line x1="150" y1="270" x2="320" y2="326" stroke="#F43F5E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="214" y="270" width="98" height="22" rx="11" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="263" y="285" text-anchor="middle" font-size="11.5" font-weight="700" fill="#BE123C">A–C 거리 179</text>

  <!-- right card -->
  <rect x="392" y="116" width="340" height="270" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="393" y="117" width="338" height="268" rx="13" fill="url(#g)"/>
  <rect x="408" y="128" width="150" height="22" rx="11" fill="#ECFDF5"/>
  <text x="483" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">② 길이를 1로 (정규화)</text>

  <circle cx="562" cy="258" r="100" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M562 258 L597.4 222.6 A50 50 0 0 1 611.8 253.2 Z" fill="#FEF3C7"/>
  <line x1="562" y1="258" x2="632.7" y2="187.3" stroke="#0F766E" stroke-width="3" marker-end="url(#mt)"/>
  <line x1="562" y1="258" x2="661.5" y2="248.4" stroke="#4F46E5" stroke-width="3" marker-end="url(#mi)"/>
  <circle cx="562" cy="258" r="4" fill="#0F172A"/>
  <line x1="632.7" y1="187.3" x2="661.5" y2="248.4" stroke="#F43F5E" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="612" y="160" width="62" height="22" rx="11" fill="#CCFBF1"/>
  <text x="643" y="175" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0F766E">A = B</text>
  <text x="670" y="254" font-size="15" font-weight="800" fill="#4F46E5">C</text>
  <text x="562" y="376" text-anchor="middle" font-size="11.5" fill="#64748B">반지름 = 1 (모든 벡터가 원 위)</text>

  <!-- takeaways -->
  <rect x="28" y="398" width="340" height="44" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="44" y="416" font-size="12" fill="#9A3412"><tspan font-weight="800">코사인</tspan> A와 B는 방향이 같다 → 유사도 1</text>
  <text x="44" y="434" font-size="12" fill="#9A3412"><tspan font-weight="800">유클리드</tspan> A에는 B보다 C가 더 가깝다</text>
  <rect x="392" y="398" width="340" height="44" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="408" y="416" font-size="12" fill="#065F46">각도가 작을수록 거리도 짧다 → <tspan font-weight="800">순위가 같다</tspan></text>
  <text x="408" y="434" font-size="12" fill="#065F46">OpenAI 임베딩은 이미 길이 1로 정규화되어 나온다</text>

  <text x="732" y="460" text-anchor="end" font-size="11" fill="#94A3B8">출처: OpenAI Docs: Embeddings FAQ · Wikipedia: Cosine similarity</text>
</svg>
