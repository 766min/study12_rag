<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>쿼리 라우팅: 질문 성격에 맞는 저장소로 보낸다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4F46E5"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F766E"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#D97706"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="378" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="98" height="24" rx="12" fill="#EEF2FF"/>
  <text x="77" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">08 · 라우팅</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">질문마다 맞는 창고로 보낸다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">저장소가 여러 개일 때, 라우터가 질문 성격을 보고 검색 경로를 고른다</text>

  <!-- questions -->
  <g font-size="12.5" font-weight="700">
    <rect x="28" y="130" width="210" height="44" rx="12" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
    <circle cx="48" cy="152" r="6" fill="#4F46E5"/><text x="62" y="157" fill="#0F172A">“이번 달 매출 합계는?”</text>
    <rect x="28" y="200" width="210" height="44" rx="12" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
    <circle cx="48" cy="222" r="6" fill="#0F766E"/><text x="62" y="227" fill="#0F172A">“휴가 규정 알려줘”</text>
    <rect x="28" y="270" width="210" height="44" rx="12" fill="#FFFFFF" stroke="#FDE68A" filter="url(#sh)"/>
    <circle cx="48" cy="292" r="6" fill="#D97706"/><text x="62" y="297" fill="#0F172A">“오늘 환율은?”</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M240 152 H262 V206 H286" stroke="#4F46E5"/>
    <path d="M240 222 H286" stroke="#0F766E"/>
    <path d="M240 292 H262 V238 H286" stroke="#D97706"/>
  </g>

  <!-- router -->
  <rect x="290" y="176" width="150" height="92" rx="16" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#sh)"/>
  <circle cx="320" cy="222" r="18" fill="#F1F5F9"/>
  <path d="M312 222 h6 M318 222 l8 -8 M318 222 l8 8 M318 222 h8" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <text x="346" y="217" font-size="14" font-weight="800" fill="#0F172A">라우터</text>
  <text x="346" y="236" font-size="11.5" fill="#64748B">LLM이 분류</text>

  <!-- arrows to destinations -->
  <path d="M442 206 H470 V152 H500" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#mi)"/>
  <path d="M442 222 H500" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#mt)"/>
  <path d="M442 238 H470 V292 H500" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ma)"/>

  <!-- destinations -->
  <rect x="504" y="126" width="228" height="52" rx="12" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <circle cx="530" cy="152" r="14" fill="#E0E7FF"/>
  <g stroke="#4F46E5" stroke-width="1.6" fill="none"><rect x="522" y="145" width="16" height="14" rx="2"/><line x1="522" y1="150" x2="538" y2="150"/><line x1="529" y1="145" x2="529" y2="159"/></g>
  <text x="554" y="149" font-size="13.5" font-weight="800" fill="#0F172A">SQL DB</text>
  <text x="554" y="167" font-size="11.5" fill="#4F46E5">정형 데이터 · 집계</text>

  <rect x="504" y="196" width="228" height="52" rx="12" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <circle cx="530" cy="222" r="14" fill="#CCFBF1"/>
  <ellipse cx="530" cy="216" rx="7" ry="2.8" fill="none" stroke="#0F766E" stroke-width="1.6"/>
  <path d="M523 216v11a7 2.8 0 0 0 14 0v-11" fill="none" stroke="#0F766E" stroke-width="1.6"/>
  <text x="554" y="219" font-size="13.5" font-weight="800" fill="#0F172A">문서 벡터 DB</text>
  <text x="554" y="237" font-size="11.5" fill="#0F766E">사내 규정 · RAG</text>

  <rect x="504" y="266" width="228" height="52" rx="12" fill="#FFFFFF" stroke="#FDE68A" filter="url(#sh)"/>
  <circle cx="530" cy="292" r="14" fill="#FEF3C7"/>
  <circle cx="530" cy="292" r="7" fill="none" stroke="#D97706" stroke-width="1.6"/>
  <ellipse cx="530" cy="292" rx="3" ry="7" fill="none" stroke="#D97706" stroke-width="1.3"/>
  <line x1="523" y1="292" x2="537" y2="292" stroke="#D97706" stroke-width="1.3"/>
  <text x="554" y="289" font-size="13.5" font-weight="800" fill="#0F172A">웹 검색</text>
  <text x="554" y="307" font-size="11.5" fill="#B45309">실시간 정보</text>

  <rect x="28" y="334" width="420" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="238" y="353" text-anchor="middle" font-size="12" fill="#3730A3">관련 없는 저장소는 <tspan font-weight="800">아예 검색하지 않는다</tspan> → 노이즈 ↓</text>
  <text x="732" y="353" text-anchor="end" font-size="11" fill="#94A3B8">출처: LangChain Docs: Router knowledge base</text>
</svg>
