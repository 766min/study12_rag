<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>임베딩 공간: 뜻이 비슷한 글은 가까이 모인다</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
  </defs>
  <rect x="1" y="1" width="758" height="418" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="94" height="24" rx="12" fill="#EEF2FF"/>
  <text x="75" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">02 · 임베딩</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">뜻이 비슷한 글은 가까이 모인다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">임베딩 공간을 2차원으로 단순화한 그림 · 실제 text-embedding-3-small은 1,536차원</text>

  <rect x="28" y="116" width="704" height="258" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="28" y="116" width="704" height="258" rx="14" fill="url(#g)"/>

  <!-- blobs -->
  <ellipse cx="210" cy="272" rx="120" ry="70" fill="#CCFBF1" fill-opacity="0.65"/>
  <ellipse cx="505" cy="185" rx="105" ry="52" fill="#E0E7FF" fill-opacity="0.8"/>
  <ellipse cx="610" cy="300" rx="92" ry="44" fill="#FFE4E6" fill-opacity="0.8"/>

  <!-- cluster chips -->
  <rect x="64" y="324" width="52" height="24" rx="12" fill="#0F766E"/><text x="90" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">과일</text>
  <rect x="420" y="128" width="52" height="24" rx="12" fill="#4F46E5"/><text x="446" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">왕족</text>
  <rect x="650" y="244" width="52" height="24" rx="12" fill="#E11D48"/><text x="676" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">탈것</text>

  <!-- search radius -->
  <circle cx="200" cy="272" r="72" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="6 5"/>

  <!-- fruit points -->
  <g stroke="#0F766E" stroke-width="2.5" fill="#FFFFFF"><circle cx="165" cy="255" r="6"/><circle cx="238" cy="292" r="6"/><circle cx="180" cy="315" r="6"/></g>
  <g font-size="13" font-weight="700" fill="#134E4A"><text x="124" y="252">사과</text><text x="248" y="297">바나나</text><text x="190" y="334">포도</text></g>

  <!-- royalty points -->
  <g stroke="#4F46E5" stroke-width="2.5" fill="#FFFFFF"><circle cx="478" cy="178" r="6"/><circle cx="548" cy="190" r="6"/><circle cx="508" cy="215" r="6"/></g>
  <g font-size="13" font-weight="700" fill="#312E81"><text x="488" y="173">왕</text><text x="558" y="195">여왕</text><text x="518" y="226">왕자</text></g>

  <!-- vehicle points -->
  <g stroke="#E11D48" stroke-width="2.5" fill="#FFFFFF"><circle cx="580" cy="300" r="6"/><circle cx="645" cy="318" r="6"/></g>
  <g font-size="13" font-weight="700" fill="#881337"><text x="540" y="324">우주선</text><text x="655" y="323">자동차</text></g>

  <!-- query -->
  <circle cx="212" cy="268" r="15" fill="#FEF3C7"/>
  <polygon points="212,257 215.2,264.5 223,265 217,270 219,278 212,273.6 205,278 207,270 201,265 208.8,264.5" fill="#F59E0B"/>
  <line x1="222" y1="258" x2="282" y2="184" stroke="#F59E0B" stroke-width="1.4"/>
  <rect x="270" y="160" width="190" height="26" rx="13" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="365" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">질문 “달콤한 과일 추천”</text>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <polygon points="306,355 308.4,360.6 314.2,361 309.8,364.8 311.2,370.6 306,367.4 300.8,370.6 302.2,364.8 297.8,361 303.6,360.6" fill="#F59E0B"/>
    <text x="320" y="366">질문</text>
    <circle cx="370" cy="362" r="5" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="382" y="366">저장된 청크</text>
    <circle cx="470" cy="362" r="7" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="3 3"/><text x="484" y="366">점선 안 = 가장 가까운 k개 = 검색 결과</text>
  </g>

  <text x="732" y="400" text-anchor="end" font-size="11" fill="#94A3B8">출처: LangChain Docs: Retrieval · OpenAI Docs: Embeddings</text>
</svg>
