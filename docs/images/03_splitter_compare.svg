<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>CharacterTextSplitter와 RecursiveCharacterTextSplitter 비교</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="368" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="112" height="24" rx="12" fill="#EEF2FF"/>
  <text x="84" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">03 · 분할기 비교</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">Recursive는 너무 크면 더 잘게 내려간다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">chunk_size를 넘는 긴 문단이 섞여 있을 때 두 분할기의 결과</text>

  <!-- left -->
  <rect x="28" y="116" width="340" height="196" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="44" y="128" width="166" height="22" rx="11" fill="#F1F5F9"/>
  <text x="127" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">CharacterTextSplitter</text>
  <text x="352" y="143" text-anchor="end" font-size="11" fill="#64748B">구분자 <tspan font-family="Consolas,'Courier New',monospace">"\n\n"</tspan> 하나</text>
  <rect x="44" y="164" width="130" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="109" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#134E4A">문단 1</text>
  <rect x="44" y="202" width="308" height="28" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.4"/>
  <text x="198" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">문단 2 (아주 긴 문단, 그대로 한 덩어리)</text>
  <line x1="44" y1="244" x2="236" y2="244" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="240" y="248" font-size="11" fill="#64748B">← chunk_size</text>
  <path d="M52 266 l8 -14 l8 14 z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="60" y="264" text-anchor="middle" font-size="10" font-weight="800" fill="#B45309">!</text>
  <text x="76" y="265" font-size="12" fill="#9A3412"><tspan font-weight="700">크기를 넘어도 자르지 않음</tspan> → 경고만 낸다</text>
  <text x="44" y="296" font-size="11.5" fill="#64748B">"Created a chunk of size … longer than …"</text>

  <!-- right -->
  <rect x="392" y="116" width="340" height="196" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="408" y="128" width="214" height="22" rx="11" fill="#CCFBF1"/>
  <text x="515" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">RecursiveCharacterTextSplitter</text>
  <rect x="408" y="164" width="130" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="473" y="183" text-anchor="middle" font-size="12" font-weight="700" fill="#134E4A">문단 1</text>
  <g font-size="12" font-weight="700" fill="#134E4A" text-anchor="middle">
    <rect x="408" y="202" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="456" y="221">문단 2-a</text>
    <rect x="512" y="202" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="560" y="221">문단 2-b</text>
    <rect x="616" y="202" width="96" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4"/><text x="664" y="221">문단 2-c</text>
  </g>
  <text x="408" y="254" font-size="11.5" fill="#475569">크면 다음 구분자로 내려간다</text>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="408" y="266" width="64" height="24" rx="12" fill="#0F766E"/><text x="440" y="282" fill="#FFFFFF"><tspan font-family="Consolas,'Courier New',monospace">\n\n</tspan> 문단</text>
    <rect x="488" y="266" width="64" height="24" rx="12" fill="#14B8A6"/><text x="520" y="282" fill="#FFFFFF"><tspan font-family="Consolas,'Courier New',monospace">\n</tspan> 줄</text>
    <rect x="568" y="266" width="64" height="24" rx="12" fill="#5EEAD4"/><text x="600" y="282" fill="#134E4A"><tspan font-family="Consolas,'Courier New',monospace">" "</tspan> 공백</text>
    <rect x="648" y="266" width="64" height="24" rx="12" fill="#CCFBF1" stroke="#99F6E4"/><text x="680" y="282" fill="#134E4A"><tspan font-family="Consolas,'Courier New',monospace">""</tspan> 글자</text>
  </g>
  <g stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ar)"><line x1="473" y1="278" x2="485" y2="278"/><line x1="553" y1="278" x2="565" y2="278"/><line x1="633" y1="278" x2="645" y2="278"/></g>

  <rect x="28" y="326" width="380" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="218" y="345" text-anchor="middle" font-size="12" fill="#0F766E">공식 문서 권장: <tspan font-weight="800">대부분 Recursive로 시작</tspan>한다</text>
  <text x="732" y="345" text-anchor="end" font-size="11" fill="#94A3B8">출처: LangChain Docs · text-splitters 1.1.3 소스</text>
</svg>
