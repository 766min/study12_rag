<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>정밀도와 재현율: 검색 결과와 정답 문서의 겹침</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="128" height="24" rx="12" fill="#EEF2FF"/>
  <text x="92" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">09 · 정밀도·재현율</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">가져온 것 중 맞은 비율, 정답 중 찾은 비율</text>
  <text x="28" y="98" font-size="13" fill="#64748B">검색 결과 5개 · 정답 문서 4개 · 그중 겹치는 것 3개인 예시</text>

  <!-- left card -->
  <rect x="28" y="116" width="404" height="236" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="48" y="146" width="236" height="158" rx="14" fill="#F0FDFA" fill-opacity="0.6" stroke="#14B8A6" stroke-width="1.6"/>
  <rect x="190" y="146" width="222" height="158" rx="14" fill="#FEF3C7" fill-opacity="0.5" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="60" y="166" font-size="12" font-weight="800" fill="#0F766E">검색 결과 (5개)</text>
  <text x="400" y="166" text-anchor="end" font-size="12" font-weight="800" fill="#B45309">정답 문서 (4개)</text>

  <g stroke="#FFFFFF" stroke-width="2">
    <circle cx="236" cy="196" r="10" fill="#0F766E"/><circle cx="236" cy="228" r="10" fill="#0F766E"/><circle cx="236" cy="260" r="10" fill="#0F766E"/>
    <circle cx="100" cy="212" r="10" fill="#E11D48"/><circle cx="146" cy="248" r="10" fill="#E11D48"/>
    <circle cx="344" cy="228" r="10" fill="#D97706"/>
  </g>
  <g font-size="11.5" font-weight="800">
    <text x="236" y="290" text-anchor="middle" fill="#0F766E">TP 3</text>
    <text x="122" y="290" text-anchor="middle" fill="#BE123C">FP 2</text>
    <text x="344" y="258" text-anchor="middle" fill="#B45309">FN 1</text>
  </g>

  <g font-size="11.5">
    <circle cx="56" cy="330" r="6" fill="#0F766E"/><text x="68" y="334" fill="#334155">TP 맞게 가져옴</text>
    <circle cx="170" cy="330" r="6" fill="#E11D48"/><text x="182" y="334" fill="#334155">FP 잘못 가져옴(노이즈)</text>
    <circle cx="326" cy="330" r="6" fill="#D97706"/><text x="338" y="334" fill="#334155">FN 놓침</text>
  </g>

  <!-- right card -->
  <rect x="452" y="116" width="280" height="236" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="468" y="132" width="248" height="60" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="482" y="155" font-size="13" font-weight="800" fill="#0F766E">정밀도 Precision</text>
  <text x="482" y="179" font-size="12.5" fill="#134E4A" font-family="Consolas,'Courier New',monospace">TP/(TP+FP) = 3/5</text>
  <text x="704" y="179" text-anchor="end" font-size="16" font-weight="800" fill="#0F766E">0.60</text>

  <rect x="468" y="202" width="248" height="60" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="482" y="225" font-size="13" font-weight="800" fill="#B45309">재현율 Recall</text>
  <text x="482" y="249" font-size="12.5" fill="#78350F" font-family="Consolas,'Courier New',monospace">TP/(TP+FN) = 3/4</text>
  <text x="704" y="249" text-anchor="end" font-size="16" font-weight="800" fill="#B45309">0.75</text>

  <rect x="468" y="272" width="248" height="60" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="482" y="295" font-size="13" font-weight="800" fill="#4338CA">F1 (조화평균)</text>
  <text x="482" y="319" font-size="12.5" fill="#312E81" font-family="Consolas,'Courier New',monospace">2·P·R / (P+R)</text>
  <text x="704" y="319" text-anchor="end" font-size="16" font-weight="800" fill="#4338CA">0.67</text>

  <rect x="28" y="364" width="430" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="243" y="382" text-anchor="middle" font-size="12" fill="#92400E">하나를 올리면 다른 하나가 <tspan font-weight="800">자주</tspan> 떨어진다 (트레이드오프)</text>
  <text x="732" y="382" text-anchor="end" font-size="11" fill="#94A3B8">출처: Wikipedia: Precision and recall · F-score</text>
</svg>
