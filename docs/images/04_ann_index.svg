<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>전수 검색, IVFFlat, HNSW 비교</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9z" fill="#D97706"/></marker>
    <symbol id="star" viewBox="-10 -10 20 20"><polygon points="0,-9 2.6,-3 9,-2.8 4,1.6 5.6,8 0,4.4 -5.6,8 -4,1.6 -9,-2.8 -2.6,-3" fill="#F59E0B"/></symbol>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="112" height="24" rx="12" fill="#EEF2FF"/>
  <text x="84" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">04 · ANN 인덱스</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">전부 재느냐, 골라서 재느냐</text>
  <text x="28" y="98" font-size="13" fill="#64748B">질문(★)과 가장 가까운 점을 찾는 세 가지 방법</text>

  <!-- card 1: exact -->
  <rect x="28" y="116" width="220" height="206" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <rect x="42" y="128" width="112" height="22" rx="11" fill="#F1F5F9"/>
  <text x="98" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">전수 검색 (기본)</text>
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="152" y1="215" x2="72" y2="180"/><line x1="152" y1="215" x2="112" y2="170"/><line x1="152" y1="215" x2="162" y2="190"/><line x1="152" y1="215" x2="212" y2="175"/><line x1="152" y1="215" x2="232" y2="215"/><line x1="152" y1="215" x2="192" y2="230"/><line x1="152" y1="215" x2="142" y2="220"/><line x1="152" y1="215" x2="82" y2="230"/><line x1="152" y1="215" x2="62" y2="260"/><line x1="152" y1="215" x2="122" y2="260"/><line x1="152" y1="215" x2="172" y2="265"/><line x1="152" y1="215" x2="227" y2="260"/><line x1="152" y1="215" x2="102" y2="200"/><line x1="152" y1="215" x2="202" y2="200"/>
  </g>
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="2">
    <circle cx="72" cy="180" r="4"/><circle cx="112" cy="170" r="4"/><circle cx="162" cy="190" r="4"/><circle cx="212" cy="175" r="4"/><circle cx="232" cy="215" r="4"/><circle cx="192" cy="230" r="4"/><circle cx="142" cy="220" r="4"/><circle cx="82" cy="230" r="4"/><circle cx="62" cy="260" r="4"/><circle cx="122" cy="260" r="4"/><circle cx="172" cy="265" r="4"/><circle cx="227" cy="260" r="4"/><circle cx="102" cy="200" r="4"/><circle cx="202" cy="200" r="4"/>
  </g>
  <use href="#star" x="142" y="205" width="20" height="20"/>
  <text x="138" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">모든 점과 거리 계산</text>
  <text x="138" y="311" text-anchor="middle" font-size="11.5" fill="#64748B">재현율 100% · 많으면 느림</text>

  <!-- card 2: ivfflat -->
  <rect x="270" y="116" width="220" height="206" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
  <rect x="284" y="128" width="70" height="22" rx="11" fill="#CCFBF1"/>
  <text x="319" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">IVFFlat</text>
  <rect x="284" y="160" width="68" height="114" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="3 3"/>
  <rect x="356" y="160" width="68" height="114" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="3 3"/>
  <rect x="428" y="160" width="52" height="114" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="3 3"/>
  <g stroke="#F59E0B" stroke-width="1.2">
    <line x1="394" y1="215" x2="354" y2="170"/><line x1="394" y1="215" x2="404" y2="190"/><line x1="394" y1="215" x2="384" y2="220"/><line x1="394" y1="215" x2="364" y2="260"/><line x1="394" y1="215" x2="414" y2="265"/>
  </g>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2">
    <circle cx="314" cy="180" r="4"/><circle cx="324" cy="230" r="4"/><circle cx="304" cy="260" r="4"/><circle cx="344" cy="200" r="4"/>
    <circle cx="454" cy="175" r="4"/><circle cx="474" cy="215" r="4"/><circle cx="434" cy="230" r="4"/><circle cx="469" cy="260" r="4"/><circle cx="444" cy="200" r="4"/>
  </g>
  <g fill="#FFFFFF" stroke="#D97706" stroke-width="2">
    <circle cx="354" cy="170" r="4"/><circle cx="404" cy="190" r="4"/><circle cx="384" cy="220" r="4"/><circle cx="364" cy="260" r="4"/><circle cx="414" cy="265" r="4"/>
  </g>
  <use href="#star" x="384" y="205" width="20" height="20"/>
  <text x="380" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">가까운 구역(list)만 계산</text>
  <text x="380" y="311" text-anchor="middle" font-size="11.5" fill="#64748B">빌드 빠름 · 메모리 적음</text>

  <!-- card 3: hnsw -->
  <rect x="512" y="116" width="220" height="206" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
  <rect x="526" y="128" width="62" height="22" rx="11" fill="#E0E7FF"/>
  <text x="557" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">HNSW</text>
  <g stroke="#CBD5E1" stroke-width="1.2">
    <line x1="556" y1="180" x2="596" y2="170"/><line x1="596" y1="170" x2="646" y2="190"/><line x1="646" y1="190" x2="696" y2="175"/><line x1="696" y1="175" x2="686" y2="200"/><line x1="686" y1="200" x2="716" y2="215"/><line x1="716" y1="215" x2="711" y2="260"/><line x1="711" y1="260" x2="656" y2="265"/><line x1="656" y1="265" x2="606" y2="260"/><line x1="606" y1="260" x2="546" y2="260"/><line x1="546" y1="260" x2="566" y2="230"/><line x1="626" y1="220" x2="646" y2="190"/><line x1="626" y1="220" x2="676" y2="230"/><line x1="676" y1="230" x2="686" y2="200"/><line x1="626" y1="220" x2="606" y2="260"/>
  </g>
  <g stroke="#D97706" stroke-width="2.4" marker-end="url(#am)">
    <line x1="560" y1="184" x2="583" y2="197"/><line x1="590" y1="203" x2="618" y2="216"/>
  </g>
  <g fill="#FFFFFF" stroke="#4F46E5" stroke-width="2">
    <circle cx="596" cy="170" r="4"/><circle cx="646" cy="190" r="4"/><circle cx="696" cy="175" r="4"/><circle cx="716" cy="215" r="4"/><circle cx="676" cy="230" r="4"/><circle cx="566" cy="230" r="4"/><circle cx="546" cy="260" r="4"/><circle cx="606" cy="260" r="4"/><circle cx="656" cy="265" r="4"/><circle cx="711" cy="260" r="4"/><circle cx="686" cy="200" r="4"/>
  </g>
  <circle cx="556" cy="180" r="5" fill="#4F46E5"/>
  <text x="548" y="168" text-anchor="middle" font-size="10.5" fill="#4338CA">진입점</text>
  <circle cx="586" cy="200" r="4" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="626" cy="220" r="5" fill="#FFFFFF" stroke="#D97706" stroke-width="2.4"/>
  <use href="#star" x="630" y="226" width="20" height="20"/>
  <text x="622" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">그래프 이웃을 따라 이동</text>
  <text x="622" y="311" text-anchor="middle" font-size="11.5" fill="#64748B">속도-재현율 좋음 · 메모리 많음</text>

  <rect x="28" y="336" width="452" height="30" rx="15" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="254" y="356" text-anchor="middle" font-size="12" fill="#92400E">인덱스가 없으면 전수 검색 · PGVector는 <tspan font-weight="800">인덱스를 자동으로 안 만든다</tspan></text>
  <text x="732" y="356" text-anchor="end" font-size="11" fill="#94A3B8">출처: pgvector README · 설치된 소스</text>
</svg>
