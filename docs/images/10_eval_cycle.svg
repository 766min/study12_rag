<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>RAG 개선 사이클: 골든셋, 평가, 실패 케이스, 원인 진단, 수정, 다시 평가</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#94A3B8"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9z" fill="#4F46E5"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="28" y="22" width="108" height="24" rx="12" fill="#EEF2FF"/>
  <text x="82" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">10 · 개선 사이클</text>
  <text x="28" y="76" font-size="21" font-weight="800" fill="#0F172A">평가하고, 원인을 찾고, 고치고, 다시 평가한다</text>
  <text x="28" y="98" font-size="13" fill="#64748B">Part 2~4 전체가 연결되는 곳 · 07_05 실습 흐름</text>

  <!-- steps -->
  <g>
    <rect x="28" y="120" width="158" height="96" rx="14" fill="#FFFFFF" stroke="#FDE68A" filter="url(#sh)"/>
    <circle cx="54" cy="146" r="13" fill="#D97706"/><text x="54" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">1</text>
    <text x="74" y="151" font-size="14" font-weight="800" fill="#0F172A">골든셋</text>
    <text x="44" y="180" font-size="11.5" fill="#64748B">질문 · 정답 · 근거 문서</text>
    <text x="44" y="198" font-size="11.5" fill="#64748B">LLM + Pydantic으로 생성</text>
  </g>
  <line x1="188" y1="168" x2="206" y2="168" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="210" y="120" width="158" height="96" rx="14" fill="#FFFFFF" stroke="#C7D2FE" filter="url(#sh)"/>
    <circle cx="236" cy="146" r="13" fill="#4F46E5"/><text x="236" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">2</text>
    <text x="256" y="151" font-size="14" font-weight="800" fill="#0F172A">RAGAS 평가</text>
    <text x="226" y="180" font-size="11.5" fill="#64748B">4대 지표 점수</text>
    <text x="226" y="198" font-size="11.5" fill="#64748B">→ CSV로 저장</text>
  </g>
  <line x1="370" y1="168" x2="388" y2="168" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="392" y="120" width="158" height="96" rx="14" fill="#FFFFFF" stroke="#FECDD3" filter="url(#sh)"/>
    <circle cx="418" cy="146" r="13" fill="#E11D48"/><text x="418" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
    <text x="438" y="151" font-size="14" font-weight="800" fill="#0F172A">실패 케이스</text>
    <text x="408" y="180" font-size="11.5" fill="#64748B">점수 &lt; 0.8 인 줄만</text>
    <text x="408" y="198" font-size="11.5" fill="#64748B">골라내기</text>
  </g>
  <line x1="552" y1="168" x2="570" y2="168" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="574" y="120" width="158" height="96" rx="14" fill="#FFFFFF" stroke="#99F6E4" filter="url(#sh)"/>
    <circle cx="600" cy="146" r="13" fill="#0F766E"/><text x="600" y="151" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
    <text x="620" y="151" font-size="14" font-weight="800" fill="#0F172A">원인 진단</text>
    <text x="590" y="180" font-size="11.5" fill="#64748B">LLM이 실패 유형 분류</text>
    <text x="590" y="198" font-size="11.5" fill="#64748B">청킹 · 임베딩 · 필터</text>
  </g>

  <path d="M653 218 V250" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- fix card -->
  <rect x="28" y="254" width="704" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <circle cx="54" cy="280" r="13" fill="#334155"/><text x="54" y="285" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">5</text>
  <text x="74" y="285" font-size="14" font-weight="800" fill="#0F172A">손잡이 돌리기</text>
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="44" y="302" width="80" height="24" rx="12" fill="#F0FDFA" stroke="#99F6E4"/><text x="84" y="318" fill="#0F766E">청킹 03</text>
    <rect x="132" y="302" width="80" height="24" rx="12" fill="#F0FDFA" stroke="#99F6E4"/><text x="172" y="318" fill="#0F766E">필터 04</text>
    <rect x="220" y="302" width="80" height="24" rx="12" fill="#F0FDFA" stroke="#99F6E4"/><text x="260" y="318" fill="#0F766E">top-k 05</text>
    <rect x="308" y="302" width="92" height="24" rx="12" fill="#F0FDFA" stroke="#99F6E4"/><text x="354" y="318" fill="#0F766E">하이브리드 06</text>
    <rect x="408" y="302" width="80" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/><text x="448" y="318" fill="#4338CA">리랭킹 07</text>
    <rect x="496" y="302" width="96" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/><text x="544" y="318" fill="#4338CA">쿼리 변환 08</text>
    <rect x="600" y="302" width="116" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A"/><text x="658" y="318" fill="#B45309">프롬프트 · 모델</text>
  </g>

  <path d="M289 252 V222" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ari)"/>
  <rect x="298" y="226" width="78" height="22" rx="11" fill="#EEF2FF"/>
  <text x="337" y="241" text-anchor="middle" font-size="11.5" font-weight="800" fill="#4338CA">다시 평가</text>

  <text x="732" y="372" text-anchor="end" font-size="11" fill="#94A3B8">출처: 07_03 · 07_05 실습 · RAGAS</text>
  <text x="28" y="372" font-size="12" fill="#475569">감이 아니라 <tspan font-weight="800">점수가 오르는지</tspan>로 효과를 확인한다</text>
</svg>
